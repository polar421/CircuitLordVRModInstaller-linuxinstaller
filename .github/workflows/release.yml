name: Release Linux beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.114"

      - name: Build release archive
        run: packaging/build-release.sh

      - name: Require an annotated tag
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "error: $GITHUB_REF_NAME is a lightweight tag." >&2
            echo "Push an annotated tag; its message becomes the release notes." >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          args=(--title "$tag" --notes-from-tag)
          if [[ "$tag" == *-* ]]; then
            echo "Tag $tag has a prerelease suffix; publishing as a prerelease."
            args+=(--prerelease)
          else
            echo "Tag $tag is a plain version; publishing as a normal release."
          fi
          gh release create "$tag" "${args[@]}" \
            artifacts/circuitlord-vrmodinstaller-1.0.0-linux-x64.tar.gz \
            artifacts/circuitlord-vrmodinstaller-1.0.0-linux-x64.tar.gz.sha256
