name: Release Linux beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag object itself is needed to read the annotated release notes.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.114"

      - name: Run tests
        run: dotnet test CircuitLord.VRModInstaller.Linux.slnx -c Release --nologo

      - name: Build release archive
        id: build
        run: |
          packaging/build-release.sh
          archive=$(find artifacts -maxdepth 1 -type f -name 'circuitlord-vrmodinstaller-*-linux-x64.tar.gz' -printf '%T@ %p\n' | sort -nr | sed -n '1s/^[^ ]* //p')
          if [ -z "$archive" ] || [ ! -f "$archive" ]; then
            echo "error: release archive was not produced" >&2
            exit 1
          fi
          archive_name=$(basename "$archive")
          version=${archive_name#circuitlord-vrmodinstaller-}
          version=${version%-linux-x64.tar.gz}
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require an annotated tag
        run: |
          # actions/checkout replaces an annotated tag with a lightweight ref.
          # Fetch the real tag object again so its message can become the notes.
          git fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_type=$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ "$tag_type" != "tag" ]; then
            echo "error: $GITHUB_REF_NAME is not an annotated tag (type: ${tag_type:-missing})." >&2
            echo "Push an annotated tag; its message becomes the release notes." >&2
            exit 1
          fi
          version="${{ steps.build.outputs.version }}"
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-*) ;;
            *)
              echo "error: $GITHUB_REF_NAME does not match the packaged application version $version." >&2
              exit 1
              ;;
          esac

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          args=(--title "$tag" --notes-from-tag)
          if [[ "$tag" == *-* ]]; then
            echo "Tag $tag has a prerelease suffix; publishing as a prerelease."
            args+=(--prerelease)
          else
            echo "Tag $tag is a plain version; publishing as a normal release."
          fi
          archive="${{ steps.build.outputs.archive }}"
          if [[ ! -f "$archive" ]]; then
            echo "error: expected release archive not found: $archive" >&2
            exit 1
          fi
          if [[ ! -f "$archive.sha256" ]]; then
            echo "error: expected release checksum not found: $archive.sha256" >&2
            exit 1
          fi
          gh release create "$tag" "${args[@]}" \
            "$archive" \
            "$archive.sha256"
