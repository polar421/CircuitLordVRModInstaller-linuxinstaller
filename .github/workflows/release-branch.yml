name: Release Linux beta from branch

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.114"

      - name: Run tests
        run: dotnet test CircuitLord.VRModInstaller.Linux.slnx -c Release --nologo

      - name: Build release archive
        id: build
        run: |
          packaging/build-release.sh
          archive=$(find artifacts -maxdepth 1 -type f -name 'circuitlord-vrmodinstaller-*-linux-x64.tar.gz' -printf '%T@ %p\n' | sort -nr | sed -n '1s/^[^ ]* //p')
          if [ -z "$archive" ] || [ ! -f "$archive" ]; then
            echo "error: release archive was not produced" >&2
            exit 1
          fi
          archive_name=$(basename "$archive")
          version=${archive_name#circuitlord-vrmodinstaller-}
          version=${version%-linux-x64.tar.gz}
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release branch and notes
        run: |
          version="${{ steps.build.outputs.version }}"
          expected="release/v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "error: branch $GITHUB_REF_NAME must be $expected for packaged version $version." >&2
            exit 1
          fi
          notes=".github/release-notes/v$version.md"
          if [ ! -f "$notes" ]; then
            echo "error: expected release notes at $notes." >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.build.outputs.version }}"
          tag="v$version"
          archive="${{ steps.build.outputs.archive }}"
          notes=".github/release-notes/$tag.md"
          if [ ! -f "$archive" ]; then
            echo "error: expected release archive not found: $archive" >&2
            exit 1
          fi
          if [ ! -f "$archive.sha256" ]; then
            echo "error: expected release checksum not found: $archive.sha256" >&2
            exit 1
          fi
          args=(--title "$tag" --notes-file "$notes" --target "$GITHUB_SHA")
          if [[ "$tag" == *-* ]]; then
            echo "Tag $tag has a prerelease suffix; publishing as a prerelease."
            args+=(--prerelease)
          else
            echo "Tag $tag is a plain version; publishing as a normal release."
          fi
          gh release create "$tag" "${args[@]}" \
            "$archive" \
            "$archive.sha256"
